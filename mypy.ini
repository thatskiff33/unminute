# mypy settings for the report-only type check (#413): tools/type_check.py runs
# it over the shipped code (workspace/) and compares the result with the
# committed baseline, tools/mypy_baseline.txt. docs/DEVELOPER_NOTES.md says how.
[mypy]
python_version = 3.14
# The app is Windows-only: check the Windows branches, also on the Linux runner.
platform = win32
# The code has few annotations yet, so check the bodies of unannotated
# functions too; without this mypy would report almost nothing.
check_untyped_defs = True
# Third-party packages are never read (no_site_packages), so the result is the
# same in every environment, whatever is installed: their imports are typed Any.
no_site_packages = True
ignore_missing_imports = True
show_error_codes = True
show_column_numbers = False
pretty = False
