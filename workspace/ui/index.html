<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Bundled assets only. No remote code, no network: connect-src 'none'.
     Audio comes from bounded data: URLs supplied by the bridge. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src data:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting workspace trial</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Meeting workspace trial</h1>
  <p id="status" role="status" aria-live="polite">Loading...</p>
</header>
<main>
  <section aria-label="Transcript">
    <ol id="transcript"></ol>
  </section>
  <audio id="player" controls preload="none"></audio>
</main>
<script src="app.js"></script>
</body>
</html>
