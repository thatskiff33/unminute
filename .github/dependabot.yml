# Security updates are always on (repo setting). This file controls routine
# version bumps: monthly, grouped into one PR, and never auto-bumping the
# torch family beyond patch releases - those are ABI-coupled and need a
# manual end-to-end test on a real recording. A cooldown means a new version
# is only proposed after it has been public for 7 days, which gives time for a
# compromised or broken release to be found and pulled.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /workspace
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: torch
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: torchaudio
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: torchcodec
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: pyannote-audio
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
