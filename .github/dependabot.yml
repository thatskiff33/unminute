# Security alerts and security updates are always on (repo setting). This file
# controls routine version bumps: GitHub Actions only, monthly, grouped into one
# PR, and only once a version has been public for 7 days, which gives time for a
# compromised or broken release to be found and pulled.
#
# Python dependencies are hash-locked (#111 B1): requirements.in is the input,
# and tools/lock.py writes requirements.txt with the same 7-day cooldown.
# Routine Python updates are a monthly re-lock by hand (docs/RELEASING.md),
# never automatic: the torch family is ABI-coupled and needs an end-to-end test
# on a real recording. tools/audit.py (daily) reports known vulnerabilities.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
