# Cuts a GitHub release when a version tag is pushed.
#
#   git tag -a v0.5.0 -m "Unminute v0.5.0" <commit on main>
#   git push origin v0.5.0
#
# The tag must be vX.Y.Z (optionally -preview.N) and must point at a commit
# already on main. Release notes come from the matching "## vX.Y.Z" section of
# CHANGELOG.md; the job fails before publishing if it is missing.
#
# The Windows package is still built and attached by hand (docs/RELEASING.md).
# #111 slice B3 replaces this with a CI build, signed provenance and an
# approval step. Values from the event are passed through environment
# variables, never pasted into the script, so a crafted tag name cannot run
# commands.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Accept only vX.Y.Z or vX.Y.Z-preview.N, and only a commit on main.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$'; then
            echo "Tag '$TAG' is not vX.Y.Z or vX.Y.Z-preview.N"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1
          fi

      # Pull the notes for this version out of CHANGELOG.md. Fails if missing,
      # so a release can never go out with empty notes.
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## $TAG" '
            $0 == h {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No section '## $TAG' found in CHANGELOG.md"; exit 1
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A -preview.N tag is published as a pre-release that does not
          # become Latest; a plain vX.Y.Z tag is a full release.
          kind=()
          case "$TAG" in *-preview.*) kind=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unminute $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "${kind[@]}"
