# Lightweight checks on every pull request, on pushes to main and nightly. Nothing
# here installs torch or the models: the full stack is ~1.5 GB and needs a gated
# Hugging Face model, so the end-to-end smoke test stays a local step before a
# release (see docs/RELEASING.md). Every job name below is a required status
# check in the branch ruleset, except the test selection and the chunks of the
# Windows unit tests: the "Unit tests (Windows)" job that needs them all stands
# for them, and "Syntax check" needs the selection too.
#
# Test selection (#500; the owner's decision, 1 Nov 2026; docs/RELEASING.md): a
# pull request runs only the unit tests mapped to the files it changes
# (tools/select_tests.py, tools/test_map.json), in as many chunks as they need;
# a push to main and the nightly run take the full suite in all its chunks.
#
# Supply-chain rules for this file (docs/RELEASING.md):
# - no permissions by default; each job asks only for what it needs;
# - every action is pinned to a full commit SHA, with its version in a comment;
# - checkouts do not keep the token in .git/config;
# - tools and test dependencies are installed from hash-locked files
#   (requirements.txt, requirements/ci*.txt); PowerShell modules are pinned to
#   an exact version and the SHA-256 of their PowerShell Gallery package, and
#   PSScriptAnalyzer also has a publisher check.
# The Workflow lint job (zizmor) flags unpinned actions, template injection,
# missing default permissions and persisted credentials; the rest is review.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The full suite every night too (#500), on main: 03:17 NZDT, 02:17 NZST.
  schedule:
    - cron: "17 14 * * *"

permissions: {}

# Superseded runs (#395): a new push to a pull request cancels that pull
# request's older run, so it stops holding runners; the required checks report
# on the new head from its own run. Every other run (a push to main) is in a
# group of its own, by run id, so it is never cancelled or queued behind
# another. In a cancelled run the "Unit tests (Windows)" job still runs, as
# always() asks, and fails on the old head, which is expected; the new run
# waits for that short Ubuntu job. Keep always(): a skipped required check
# counts as passing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-tests:
    # Which unit tests run (#500). On a pull request: the files its merge commit
    # changes against the base branch (the merge's first parent, so the same set
    # as against the merge base, less what main already has), through
    # tools/test_map.json. A push to main and the nightly run take everything.
    # The selector, its map and the duration table come from the base commit,
    # not the pull request (as the Review record check runs its parser, #442),
    # so a pull request cannot narrow its own selection; one that changes them
    # runs everything. The selector reads the file names NUL-separated, and
    # nothing from the pull request reaches a shell line. Not a required check
    # itself: "Syntax check" and "Unit tests (Windows)" need it, always run, and
    # fail unless it succeeded.
    name: Select tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      names: ${{ steps.select.outputs.names }}
      chunks: ${{ steps.select.outputs.chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: the base branch and the pull request.
          fetch-depth: 2
      # The runner image's Python: the selector uses the standard library only.
      - name: Select the tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          trusted=HEAD
          if [ "$EVENT" = pull_request ]; then
            git rev-parse --verify --quiet 'HEAD^2' > /dev/null || { echo "Not a merge commit."; exit 1; }
            trusted='HEAD^1'
          fi
          selector="$RUNNER_TEMP/selector"
          mkdir -p "$selector"
          # Every test, in FULL_CHUNKS parts.
          everything() {
            { echo "mode=all"; echo "names="; echo "chunks=[1, 2, 3, 4, 5, 6, 7, 8]"; } >> "$GITHUB_OUTPUT"
          }
          if ! git cat-file -e "$trusted:tools/select_tests.py" 2> /dev/null; then
            # A base without the selector (only the pull request that added it,
            # #500): everything runs, and no code from the pull request decides that.
            echo "The base commit has no test selector: every test runs."
            everything
            exit 0
          fi
          for file in select_tests.py test_map.json test_durations.json; do
            git show "$trusted:tools/$file" > "$selector/$file"
          done
          if [ "$EVENT" = pull_request ]; then
            # The selection goes to scratch files first. If the base's selector
            # fails, every test runs instead, and nothing it wrote is used: a
            # broken selector on main must not fail every pull request, its own
            # fix included (#503 review). That is never narrower. A push to main
            # or the nightly run below still fails loudly.
            picked="$RUNNER_TEMP/selection.out"
            notes="$RUNNER_TEMP/selection.md"
            if python3 -I "$selector/select_tests.py" --root . --changed 'HEAD^1' HEAD \
                --github-output "$picked" --summary "$notes"; then
              cat "$picked" >> "$GITHUB_OUTPUT"
              cat "$notes" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::The base commit's test selector failed: every test runs."
              everything
            fi
          else
            python3 -I "$selector/select_tests.py" --root . --all \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

  check:
    # Follows the test selection (#500) for its unit tests. It needs the
    # selection and always runs, failing if the selection did not succeed: a
    # required check skipped because a job it needs failed would count as passing.
    name: Syntax check
    needs: select-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: The test selection succeeded
        env:
          SELECTION: ${{ needs.select-tests.result }}
        run: |
          if [ "$SELECTION" != success ]; then
            echo "The test selection did not succeed ($SELECTION)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # Byte-compile every Python file. Catches syntax errors without importing
      # torch or faster-whisper.
      - name: Compile Python sources
        run: python -m compileall -q -f .claude/hooks tests tools workspace

      # Model-free tests. numpy, PyAV and cryptography (at their pinned
      # versions) let the workspace core and encryption tests run here;
      # Windows-only tests skip on Linux and run in the "Unit tests (Windows)" job.
      - name: Install test dependencies
        run: |
          python tools/lock.py --subset numpy av cryptography --output "$RUNNER_TEMP/test-requirements.txt"
          pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --no-deps -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Unit tests, as selected
        env:
          MODE: ${{ needs.select-tests.outputs.mode }}
          SELECTED: ${{ needs.select-tests.outputs.names }}
        run: |
          case "$MODE" in
            all) python tools/run_tests.py ;;
            some)
              read -r -a names <<< "$SELECTED"
              python tools/run_tests.py --only "${names[@]}" ;;
            none) echo "No file changed: no unit test to run." ;;
            *) echo "Unknown test selection."; exit 1 ;;
          esac

      # Parse every tracked PowerShell script and fail on any error.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "${file}: $_" }; $failed = $true }
            else { Write-Host "$file parsed cleanly" }
          }
          if ($failed) { exit 1 }


  windows-tests-chunk:
    # The app is Windows-only. These jobs install the window shell's packages
    # too, and each fails if any test is skipped for a reason other than the
    # short list in tools/run_tests.py, so clipboard, Credential Manager,
    # junction, file-lock and Windows path tests are really exercised. The
    # suite runs in parts on separate machines at once (#386): tools/run_tests.py
    # deals whole test classes out by their measured times, every class to
    # exactly one part. The parts come from the test selection (#500): the full
    # suite in tools/select_tests.py's FULL_CHUNKS parts, or a pull request's
    # selected tests in as many parts as their measured times need, numbered 1 to
    # N (tests/test_select_tests.py). When nothing changed there are none, and
    # "Unit tests (Windows)" checks that this job was skipped.
    name: Windows tests, chunk ${{ matrix.chunk }} of ${{ strategy.job-total }}
    needs: select-tests
    if: ${{ needs.select-tests.outputs.mode != 'none' }}
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.select-tests.outputs.chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          # pip's download cache, keyed on the lock; every file is still
          # checked against its hash when it is installed.
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        # The window shell's packages, numpy, PyAV, cryptography, and the download stack
        # (huggingface_hub, httpx) for the download-process tests: these and
        # their dependencies from the lock, every file checked against its hash.
        shell: pwsh
        run: |
          python tools/lock.py --subset numpy av cryptography huggingface_hub pywebview sounddevice truststore `
            --output "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps --find-links packaging/wheels `
            -r "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Windows PowerShell's module analysis cache for the installer tests (#389):
      # filling it took 41 to 50 s in each chunk with installer tests, so it is
      # kept between runs, keyed by the runner image and the Windows PowerShell
      # version. A miss, or a stale or empty file, only costs that time again
      # (module_cache in tests/test_hardening.py). It holds module paths and the
      # command names they export, nothing from the repository.
      - name: Module analysis cache key
        id: psmodules
        shell: pwsh
        run: |
          $ps = powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "key=psmodule-analysis-$env:ImageOS-$env:ImageVersion-$ps" >> $env:GITHUB_OUTPUT
          "UNMINUTE_PSMODULE_CACHE=$env:RUNNER_TEMP\psmodules\ModuleAnalysisCache" >> $env:GITHUB_ENV
      - name: Restore the module analysis cache
        id: psmodules-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\psmodules\ModuleAnalysisCache
          key: ${{ steps.psmodules.outputs.key }}
      - name: Unit tests (strict skips), this chunk
        env:
          CHUNK: ${{ matrix.chunk }}
          CHUNKS: ${{ strategy.job-total }}
          # Test module and class names, checked by the selector; empty for everything.
          SELECTED: ${{ needs.select-tests.outputs.names }}
        run: |
          $only = @()
          if ($env:SELECTED) { $only = @('--only') + ($env:SELECTED -split ' ') }
          python tools/run_tests.py --strict-skips --chunk "$env:CHUNK/$env:CHUNKS" @only
          exit $LASTEXITCODE
      # Saved only after a miss, by a chunk whose installer tests filled it; the
      # first chunk to save wins and the others' saves are refused, harmlessly.
      - name: Was the module analysis cache filled
        id: psmodules-filled
        if: ${{ !cancelled() && steps.psmodules-restore.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $file = Get-Item -LiteralPath $env:UNMINUTE_PSMODULE_CACHE -ErrorAction Ignore
          "filled=$([bool]($file -and $file.Length -gt 0))" >> $env:GITHUB_OUTPUT
      - name: Save the module analysis cache
        if: ${{ !cancelled() && steps.psmodules-filled.outputs.filled == 'True' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\psmodules\ModuleAnalysisCache
          key: ${{ steps.psmodules.outputs.key }}

  windows-tests:
    # The required check. It passes only when the selection succeeded and every
    # chunk it chose passed: a failed, cancelled or skipped chunk fails it, and
    # always() makes it run (and fail) then rather than be skipped, which would
    # count as passing. Only when nothing changed may the chunks be skipped, and
    # only on a pull request: a push to main or the nightly run must have run
    # everything (tools/run_tests.py, gate). Like the selector, the gate runs from
    # the base commit, so a pull request cannot loosen its own gate.
    name: Unit tests (Windows)
    needs: [select-tests, windows-tests-chunk]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The runner image's Python is enough: the check uses the standard library.
      - name: Every selected chunk passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          trusted=HEAD
          if [ "$EVENT" = pull_request ]; then trusted='HEAD^1'; fi
          mkdir -p "$RUNNER_TEMP/gate"
          git show "$trusted:tools/run_tests.py" > "$RUNNER_TEMP/gate/run_tests.py"
          python3 -I "$RUNNER_TEMP/gate/run_tests.py" --gate

  resolve:
    # Prove the locks are current and complete (#111 B1). tools/lock.py --check
    # resolves requirements.in and the CI tool inputs again, to the locked
    # versions with hashes taken afresh from PyPI, and must reproduce each lock
    # exactly (catching an edited hash or line, or an input changed without a
    # re-lock). On a pull request, --compare lists every version change against
    # the base branch for review and fails on a downgrade not pinned in the
    # .in file. Then pip downloads every Windows wheel in requirements.txt with
    # its hash checked, exactly as the package build installs them. proxy_tools
    # has no published wheel; it comes from the hash-checked copy in
    # packaging/wheels.
    name: Requirements resolve (wheels only)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator
        # in a plain scalar, which made the whole workflow file invalid.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci-lock.txt
      - name: Every lock matches its input
        run: python tools/lock.py --check
      - name: Version changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_REF"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/lock.py --compare FETCH_HEAD
      - name: Download every pinned wheel, hashes checked
        run: >
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps --find-links packaging/wheels
          --dest "$env:RUNNER_TEMP/wheels" -r requirements.txt

  lint-python:
    # Rule set lives in ruff.toml. Ruff comes from requirements/ci.txt with
    # --require-hashes rather than a marketplace action.
    name: Ruff
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci.txt
      - name: Lint
        run: ruff check --output-format github .

  lint-powershell:
    # PSScriptAnalyzer on every tracked PowerShell script. Stylistic rules that
    # are wrong for an interactive console installer are excluded: Write-Host
    # is the point, and the empty catch blocks are deliberate "try the next
    # candidate" probes. The module is pinned by version and by the SHA-256 of
    # its PowerShell Gallery package, and must carry a valid Microsoft
    # signature.
    #
    # The Gallery fails now and then (#427), so the package (.nupkg) is fetched
    # directly, up to 3 times with a growing wait, and kept in the Actions cache
    # under a key of its version and SHA-256 (no partial-key fallback). A copy
    # from the cache is hashed again before use, and one that does not match is
    # thrown away and downloaded afresh: the cache only saves a download, it is
    # never trusted. The job fails if no package matching the hash is obtained.
    # To move the pin, see docs/DEVELOPER_NOTES.md ("The PowerShell Gallery").
    name: PSScriptAnalyzer
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      PSSA_VERSION: "1.25.0"
      PSSA_SHA256: "14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the pinned PSScriptAnalyzer package
        id: pssa-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\pssa\PSScriptAnalyzer.${{ env.PSSA_VERSION }}.nupkg
          key: psscriptanalyzer-${{ env.PSSA_VERSION }}-${{ env.PSSA_SHA256 }}
      - name: Get and check the pinned PSScriptAnalyzer package
        id: pssa-get
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "pssa\PSScriptAnalyzer.$env:PSSA_VERSION.nupkg"
          [void][IO.Directory]::CreateDirectory((Split-Path -Parent $package))
          function Test-Pinned([string]$Path) {
            (Test-Path -LiteralPath $Path -PathType Leaf) -and
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash -eq $env:PSSA_SHA256
          }
          # A restored copy is used only if it matches the pin.
          if ((Test-Path -LiteralPath $package) -and -not (Test-Pinned $package)) {
            Write-Warning "The cached package does not match its pinned SHA-256; downloading it instead."
            Remove-Item -LiteralPath $package -Force
          }
          $url = "https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/$env:PSSA_VERSION"
          $part = "$package.part"
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path -LiteralPath $package); $attempt++) {
            if ($attempt -gt 1) { Start-Sleep -Seconds (15 * ($attempt - 1)) }
            try {
              Invoke-WebRequest -Uri $url -OutFile $part -TimeoutSec 300
              if (Test-Pinned $part) { Move-Item -LiteralPath $part -Destination $package }
              else { Write-Warning "Attempt ${attempt}: the download does not match the pinned SHA-256." }
            } catch {
              Write-Warning "Attempt ${attempt}: $($_.Exception.Message)"
            }
            Remove-Item -LiteralPath $part -Force -ErrorAction Ignore
          }
          if (-not (Test-Pinned $package)) {
            Write-Error "No PSScriptAnalyzer $env:PSSA_VERSION package matching the pinned SHA-256 could be obtained."
            exit 1
          }
          # Unpacked into a new folder and imported from there by path, so no
          # other copy of the module is used.
          $module = Join-Path $env:RUNNER_TEMP ("pssa\m" + [guid]::NewGuid().ToString("N").Substring(0, 8))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($package, $module)
          "module=$module" >> $env:GITHUB_OUTPUT
      # Saved only after a miss, and only a package that matched the pin above.
      - name: Save the pinned PSScriptAnalyzer package
        if: ${{ steps.pssa-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\pssa\PSScriptAnalyzer.${{ env.PSSA_VERSION }}.nupkg
          key: psscriptanalyzer-${{ env.PSSA_VERSION }}-${{ env.PSSA_SHA256 }}
      - name: Analyse the PowerShell scripts
        shell: pwsh
        env:
          PSSA_MODULE: ${{ steps.pssa-get.outputs.module }}
        run: |
          # Every file that runs must carry a valid signature; the module's own
          # files must be Microsoft's (its bundled Newtonsoft.Json is signed by
          # the .NET Foundation).
          $unsigned = Get-ChildItem $env:PSSA_MODULE -Recurse -Include *.dll, *.psm1, *.psd1, *.ps1xml |
            ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              $microsoft = $sig.SignerCertificate.Subject -match 'O=Microsoft Corporation'
              if ($sig.Status -ne 'Valid' -or (-not $microsoft -and $_.Name -notlike 'Newtonsoft.*')) {
                "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
              }
            }
          if ($unsigned) { $unsigned | ForEach-Object { Write-Error $_ }; exit 1 }
          Import-Module (Join-Path $env:PSSA_MODULE "PSScriptAnalyzer.psd1")
          $loaded = Get-Module PSScriptAnalyzer
          if (@($loaded).Count -ne 1 -or $loaded.Version -ne [version]$env:PSSA_VERSION -or
              -not $loaded.ModuleBase.StartsWith($env:PSSA_MODULE, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "PSScriptAnalyzer $env:PSSA_VERSION did not load from the checked package."
            exit 1
          }
          $findings = git ls-files '*.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingEmptyCatchBlock, PSUseShouldProcessForStateChangingFunctions }
          $findings | Format-Table ScriptName, Severity, RuleName, Line, Message -AutoSize -Wrap
          if (@($findings).Count -gt 0) { exit 1 }
          "PowerShell scripts: no findings"

  lint-workflows:
    # zizmor audits the workflow files themselves: template injection, unpinned
    # actions, excessive permissions, credential persistence. Offline mode, so
    # it needs no token.
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install zizmor (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci.txt
      - name: Audit workflows
        run: zizmor --offline --format github .

  ui-idle:
    # Counts what the idle page does per minute of page time (bridge calls,
    # timers, meeting-list rebuilds), visible and hidden, in headless Edge with
    # the design fixtures. Counted, not timed, so it is stable on a hosted runner.
    name: UI idle (headless Edge)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Count idle work
        shell: pwsh
        run: |
          python tools/ui_idle_check.py ui-idle.json
          $code = $LASTEXITCODE
          if (Test-Path ui-idle.json) {
            "``````json" >> $env:GITHUB_STEP_SUMMARY
            Get-Content ui-idle.json >> $env:GITHUB_STEP_SUMMARY
            "``````" >> $env:GITHUB_STEP_SUMMARY
          }
          exit $code

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The runner image's Node.js; nothing is installed from npm.
      # The page's scripts are ES modules (#488). Node.js's --check passes a
      # .js file with import or export without parsing it as a module (Node.js
      # 24, 6 Nov 2026), so each one is checked from standard input as a module.
      - name: Check every tracked JavaScript file parses
        run: |
          git ls-files -z 'workspace/ui/*.js' | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::does not parse as a module"; exit 1; }
          done
          git ls-files -z '*.js' ':!workspace/ui/*.js' | xargs -0 -n1 node --check
