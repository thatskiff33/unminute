# Lightweight checks on every pull request and on pushes to main. Nothing here
# installs torch or the models: the full stack is ~1.5 GB and needs a gated
# Hugging Face model, so the end-to-end smoke test stays a local step before a
# release (see docs/RELEASING.md). Every job name below is a required status
# check in the branch ruleset.
#
# Supply-chain rules for this file (docs/RELEASING.md):
# - no permissions by default; each job asks only for what it needs;
# - every action is pinned to a full commit SHA, with its version in a comment;
# - checkouts do not keep the token in .git/config;
# - tools and test dependencies are installed from hash-locked files
#   (requirements.txt, requirements/ci*.txt) or pinned to an exact version with
#   a publisher check.
# The Workflow lint job (zizmor) flags unpinned actions, template injection,
# missing default permissions and persisted credentials; the rest is review.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Byte-compile every Python file. Catches syntax errors without importing
      # torch or faster-whisper.
      - name: Compile Python sources
        run: python -m compileall -q -f *.py tests tools workspace

      # Model-free tests. numpy and PyAV (at their pinned versions) let the
      # workspace core tests run here; Windows-only tests skip on Linux and run
      # in the "Unit tests (Windows)" job.
      - name: Install test dependencies
        run: |
          python tools/lock.py --subset numpy av --output "$RUNNER_TEMP/test-requirements.txt"
          pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --no-deps -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Unit tests
        run: python tools/run_tests.py

      # Parse every tracked PowerShell script and fail on any error.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "${file}: $_" }; $failed = $true }
            else { Write-Host "$file parsed cleanly" }
          }
          if ($failed) { exit 1 }


  windows-tests:
    # The app is Windows-only. This job installs the window shell's packages
    # too, and fails if any test is skipped for a reason other than the short
    # list in tools/run_tests.py, so clipboard, Credential Manager, junction,
    # file-lock and Windows path tests are really exercised.
    name: Unit tests (Windows)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # The window shell's packages, numpy and PyAV, and the download stack
        # (huggingface_hub, httpx) for the download-process tests: these and
        # their dependencies from the lock, every file checked against its hash.
        shell: pwsh
        run: |
          python tools/lock.py --subset numpy av huggingface_hub pywebview sounddevice truststore `
            --output "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps --find-links packaging/wheels `
            -r "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unit tests (strict skips)
        run: python tools/run_tests.py --strict-skips

  resolve:
    # Prove the locks are current and complete (#111 B1). tools/lock.py --check
    # resolves requirements.in and the CI tool inputs again and must reproduce
    # each lock exactly (catching a hand edit, or an input changed without a
    # re-lock). Then pip downloads every Windows wheel in requirements.txt with
    # its hash checked, exactly as the package build installs them. proxy_tools
    # has no published wheel; it comes from the hash-checked copy in
    # packaging/wheels.
    name: Requirements resolve (wheels only)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator
        # in a plain scalar, which made the whole workflow file invalid.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci-lock.txt
      - name: Every lock matches its input
        run: python tools/lock.py --check
      - name: Download every pinned wheel, hashes checked
        run: >
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps --find-links packaging/wheels
          --dest "$env:RUNNER_TEMP/wheels" -r requirements.txt

  lint-python:
    # Rule set lives in ruff.toml. Ruff comes from requirements/ci.txt with
    # --require-hashes rather than a marketplace action.
    name: Ruff
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci.txt
      - name: Lint
        run: ruff check --output-format github .

  lint-powershell:
    # PSScriptAnalyzer on every tracked PowerShell script. Stylistic rules that
    # are wrong for an interactive console installer are excluded: Write-Host
    # is the point, and the empty catch blocks are deliberate "try the next
    # candidate" probes. The module is pinned and must carry a valid Microsoft
    # signature.
    name: PSScriptAnalyzer
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Analyse the PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -Confirm:$false
          $module = Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq '1.25.0' | Select-Object -First 1
          # Every file that runs must carry a valid signature; the module's own
          # files must be Microsoft's (its bundled Newtonsoft.Json is signed by
          # the .NET Foundation).
          $unsigned = Get-ChildItem $module.ModuleBase -Recurse -Include *.dll, *.psm1, *.psd1, *.ps1xml |
            ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              $microsoft = $sig.SignerCertificate.Subject -match 'O=Microsoft Corporation'
              if ($sig.Status -ne 'Valid' -or (-not $microsoft -and $_.Name -notlike 'Newtonsoft.*')) {
                "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
              }
            }
          if ($unsigned) { $unsigned | ForEach-Object { Write-Error $_ }; exit 1 }
          Import-Module $module.Path
          $findings = git ls-files '*.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingEmptyCatchBlock, PSUseShouldProcessForStateChangingFunctions }
          $findings | Format-Table ScriptName, Severity, RuleName, Line, Message -AutoSize -Wrap
          if (@($findings).Count -gt 0) { exit 1 }
          "PowerShell scripts: no findings"

  lint-workflows:
    # zizmor audits the workflow files themselves: template injection, unpinned
    # actions, excessive permissions, credential persistence. Offline mode, so
    # it needs no token.
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor (hash-locked)
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator.
        run: >
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/ci.txt
      - name: Audit workflows
        run: zizmor --offline --format github .
