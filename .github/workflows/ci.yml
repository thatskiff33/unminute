# Lightweight checks on every pull request and on pushes to main. Nothing here
# installs torch or the models: the full stack is ~1.5 GB and needs a gated
# Hugging Face model, so the end-to-end smoke test stays a local step before a
# release (see docs/RELEASING.md). All four job names are required status
# checks in the branch ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Byte-compile every Python file. Catches syntax errors without importing
      # torch, faster-whisper or tkinter.
      - name: Compile Python sources
        run: python -m compileall -q -f *.py tests tools workspace

      # Model-free tests (stdlib only). Tests that need the full app stack
      # skip themselves here; run them locally in the installed environment.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Parse the installer with the PowerShell parser and fail on any error.
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host "install.ps1 parsed cleanly"

      # requirements.txt must stay a strict pin list (installer uses --only-binary).
      - name: Check requirements are fully pinned
        run: |
          # Tolerate a UTF-8 BOM at the top of the file (Windows PowerShell writes one).
          bad=$(sed '1s/^\xEF\xBB\xBF//' requirements.txt | grep -vE '^\s*(#|$)' | grep -vE '^[A-Za-z0-9_.\-]+(\[[^]]+\])?==' || true)
          if [ -n "$bad" ]; then echo "Unpinned lines:"; echo "$bad"; exit 1; fi
          echo "All requirements pinned"

  resolve:
    # Prove the pinned set still resolves as Windows wheels only, exactly as
    # install.ps1 installs it. Catches a pin with no Windows wheel or a conflict
    # between pins (e.g. after a Dependabot bump) without downloading packages.
    name: Requirements resolve (wheels only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dry-run install
        # Block scalar: ":all:" followed by a space is a YAML mapping indicator
        # in a plain scalar, which made the whole workflow file invalid.
        run: >
          python -m pip install --dry-run --ignore-installed --only-binary=:all:
          --disable-pip-version-check -r requirements.txt

  lint-python:
    # Rule set lives in ruff.toml. Ruff is installed from PyPI rather than via
    # a marketplace action: the runner could not resolve astral-sh/ruff-action@v4
    # (job failed at "Set up job"), and a pip install has no such dependency.
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint
        run: ruff check --output-format github .

  lint-powershell:
    # PSScriptAnalyzer on the installer. Stylistic rules that are wrong for an
    # interactive console installer are excluded: Write-Host is the point, and
    # the empty catch blocks are deliberate "try the next candidate" probes.
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Analyse install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Confirm:$false
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingEmptyCatchBlock, PSUseShouldProcessForStateChangingFunctions
          $findings | Format-Table Severity, RuleName, Line, Message -AutoSize -Wrap
          if (@($findings).Count -gt 0) { exit 1 }
          "install.ps1: no findings"
