# The "Review record" check (#410): it passes only when a pull request comment
# or review records an independent review of the pull request's head commit, or
# carries one to it with an identical range-diff, as tools/dev_status.py reads it
# (one definition, shared with --pr; the finish-pr skill gives the format). A push
# starts a new run on the new head, which fails until a record names that head.
#
# Not a required status check yet (the owner's decision, 27 Oct 2026, #410): it
# runs on every pull request for about a week, then the owner adds it to the
# ruleset, and docs/RELEASING.md and tests/test_consistency.py list it.
#
# What starts a run:
# - a push, or an edit of the description (its "Writer:" line): pull_request;
# - a review submitted, edited or dismissed (a dismissed review no longer counts
#   as a record, #442): pull_request_review, which runs in the same read-only
#   pull request context;
# - a comment: not this workflow itself, because a run for an issue_comment event
#   reports on main's latest commit, not the pull request's head. Instead
#   review-record-rerun.yml (from main) re-runs this pull request's run when a
#   collaborator comments, or edits or deletes a comment, so posting the record
#   turns this check green.
#
# The same supply-chain rules as ci.yml apply (see its header). This job reads
# the pull request's comments and reviews with a read-only token; it holds no
# secret and writes nothing. It runs tools/dev_status.py from the base commit,
# not the pull request's head, so a pull request cannot loosen the parser for its
# own check (#442). The workflow file itself still comes from the pull request,
# as for every pull_request check (docs/SECURITY_MODEL.md, T15).
name: Review record

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

# The same groups as ci.yml (#395): a newer push or edit cancels the pull
# request's older run. A review's run has a group of its own (its run id) and is
# never cancelled, so it can never cancel the run for a newer push; a superseded
# one finishes in a minute and reports only on its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  record:
    name: Review record
    # pull_request_review takes no branch filter: match pull_request's.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read          # the checkout of the base commit
      pull-requests: read     # the pull request's description, comments and reviews
    steps:
      # The base commit (on main), not the pull request's code: the checker is the
      # one already reviewed and merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The commit checked is the one this run was started for (the event's head),
      # so a re-run after a later push still reports on its own commit.
      - name: Check for a review record naming the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/dev_status.py --review-record "$PR_NUMBER" --head "$HEAD_SHA"
