# Report-only quality checks (#125): they never block a merge, so they are not
# required status checks (docs/RELEASING.md). The UI idle and JavaScript syntax
# jobs that started here became required and moved into ci.yml (owner decision,
# 21 Oct 2026, #121). The same supply-chain rules as ci.yml apply (see its header).
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Superseded pull request runs are cancelled; pushes to main never are (see ci.yml, #395).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dead-code:
    # Report only (#136): vulture over the shipped code, with the reviewed
    # names in tools/vulture_whitelist.py. Anything listed is a candidate to
    # remove. It becomes a ratchet in tests/budgets.json once it is stable.
    name: Dead code (report only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install vulture from its hash-locked file
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r requirements/ci-vulture.txt
      - name: Report unused code
        run: |
          set +e
          python -m vulture workspace tools/vulture_whitelist.py --min-confidence 60 > vulture.txt
          code=$?
          set -e
          # vulture exits 3 when it finds something: reported, not failed.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then cat vulture.txt; exit "$code"; fi
          count=$(grep -c . vulture.txt || true)
          {
            echo "Unused code reported by vulture: $count"
            echo '```'
            cat vulture.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat vulture.txt

  type-check:
    # Report only (#413; the owner's decision of 27 Oct 2026): mypy over the
    # shipped code with the settings in mypy.ini, compared by tools/type_check.py
    # with the committed baseline, tools/mypy_baseline.txt. An error new since
    # the baseline is a warning on the pull request, never a failure; the job
    # fails only if mypy cannot run. Making it a gate needs the owner. The page
    # (workspace/ui) has no type check for now (the same decision).
    name: Type check (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install mypy from its hash-locked file
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r requirements/ci-mypy.txt
      - name: Report type errors against the baseline
        run: python tools/type_check.py

  coverage:
    # Report only: no floor (docs/RELEASE_STANDARD.md, section 7; a floor would
    # be a gate, which needs the owner, #413). Lines and branches, with the
    # settings in .coveragerc, which since #413 also measures the Python
    # processes the tests start (a child with an environment of its own, or the
    # decoder once it lowers itself to Low integrity, cannot write its data).
    # The data files are kept in the runner's temporary folder, never in the
    # checkout or in a folder a test looks at, and joined before the report.
    # Bounded at 45 minutes (#406, the #386 CI-time budget). It took 17 to 26 minutes in
    # 34 of the 40 latest runs as at 27 October 2026 (4 were cancelled), but 1 h 41 min
    # and 1 h 44 min in two (65774f2 and 9d246f7): only the installer tests (tests/test_hardening.py,
    # tests/test_uninstall_offboard.py), which start Windows PowerShell, were slower, by 12
    # to 21 times; every other module took its usual time, and the module analysis cache
    # those tests fill (#332) was filled as usual (48 and 50 s). The cause is not known.
    # A run past the bound fails, which blocks nothing, and frees the runner.
    name: Coverage (report only)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies and coverage
        # The same packages as the "Unit tests (Windows)" job in ci.yml, plus
        # coverage from its hash-locked file.
        shell: pwsh
        run: |
          python tools/lock.py --subset numpy av cryptography huggingface_hub pywebview sounddevice truststore `
            --output "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps --find-links packaging/wheels `
            -r "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps -r requirements/ci-coverage.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unit tests under coverage
        shell: pwsh
        env:
          COVERAGE_FILE: ${{ runner.temp }}\coverage\.coverage
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:COVERAGE_FILE) | Out-Null
          python -m coverage run tools/run_tests.py
          exit $LASTEXITCODE
      # Reported even when a test failed, so the figures are not lost.
      - name: Coverage report
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          COVERAGE_FILE: ${{ runner.temp }}\coverage\.coverage
        run: |
          python -m coverage combine
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m coverage report
          python -m coverage report --format=markdown >> $env:GITHUB_STEP_SUMMARY

  pester:
    # Report only until it has passed on 5 consecutive pull requests (#111 B6a; the
    # owner's decisions of 21 and 23 October 2026; docs/RELEASING.md). The installer's Pester
    # tests (tests/powershell) under Windows PowerShell 5.1, which runs the
    # installer. tools/run_pester.ps1 downloads Pester 5.9.1 from the PowerShell
    # Gallery and uses it only if the package's SHA-256 matches the one recorded
    # there; Pester is a development tool under the Apache License 2.0 and is not
    # in the package. The Python-driven installer tests in "Unit tests (Windows)"
    # stay the required check.
    #
    # The Gallery fails now and then (#427): the script tries up to 3 times, and
    # the package is kept in the Actions cache under a key of its version and
    # SHA-256 (the same values as tools/run_pester.ps1, which
    # tests/test_consistency.py holds equal). The script hashes a restored copy
    # again and downloads afresh if it does not match, so the cache is never
    # trusted; only a package that matches is saved.
    name: PowerShell tests, Pester (report only)
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      PESTER_VERSION: "5.9.1"
      PESTER_SHA256: "8dd4060fc3bc895f05bd655e4ab82abe346de54a4e6415dfb727cc8378672b69"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the pinned Pester package
        id: pester-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\pester\pester.${{ env.PESTER_VERSION }}.nupkg
          key: pester-${{ env.PESTER_VERSION }}-${{ env.PESTER_SHA256 }}
      - name: Run the Pester tests with the pinned Pester
        shell: powershell
        run: |
          & ./tools/run_pester.ps1 -ModuleRoot "$env:RUNNER_TEMP\pester"
          exit $LASTEXITCODE
      # Saved after a miss, whether or not the tests passed, but only a package
      # that matches the pin.
      - name: Was the Pester package checked
        id: pester-checked
        if: ${{ !cancelled() && steps.pester-restore.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "pester\pester.$env:PESTER_VERSION.nupkg"
          $matched = (Test-Path -LiteralPath $package -PathType Leaf) -and
            (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash -eq $env:PESTER_SHA256
          "matched=$matched" >> $env:GITHUB_OUTPUT
      - name: Save the pinned Pester package
        if: ${{ !cancelled() && steps.pester-checked.outputs.matched == 'True' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}\pester\pester.${{ env.PESTER_VERSION }}.nupkg
          key: pester-${{ env.PESTER_VERSION }}-${{ env.PESTER_SHA256 }}
