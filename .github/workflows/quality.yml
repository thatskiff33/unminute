# Report-only quality checks (#125): they never block a merge, so they are not
# required status checks (docs/RELEASING.md). The UI idle and JavaScript syntax
# jobs that started here became required and moved into ci.yml (owner decision,
# 21 Oct 2026, #121). The same supply-chain rules as ci.yml apply (see its header).
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  dead-code:
    # Report only (#136): vulture over the shipped code, with the reviewed
    # names in tools/vulture_whitelist.py. Anything listed is a candidate to
    # remove. It becomes a ratchet in tests/budgets.json once it is stable.
    name: Dead code (report only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install vulture from its hash-locked file
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r requirements/ci-vulture.txt
      - name: Report unused code
        run: |
          set +e
          python -m vulture workspace tools/vulture_whitelist.py --min-confidence 60 > vulture.txt
          code=$?
          set -e
          # vulture exits 3 when it finds something: reported, not failed.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then cat vulture.txt; exit "$code"; fi
          count=$(grep -c . vulture.txt || true)
          {
            echo "Unused code reported by vulture: $count"
            echo '```'
            cat vulture.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat vulture.txt

  coverage:
    # Report only: no floor yet (docs/RELEASE_STANDARD.md, section 7). Worker
    # and decoder child processes are not measured.
    name: Coverage (report only)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test dependencies and coverage
        # The same packages as the "Unit tests (Windows)" job in ci.yml, plus
        # coverage from its hash-locked file.
        shell: pwsh
        run: |
          python tools/lock.py --subset numpy av cryptography huggingface_hub pywebview sounddevice truststore `
            --output "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps --find-links packaging/wheels `
            -r "$env:RUNNER_TEMP/test-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            --require-hashes --no-deps -r requirements/ci-coverage.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unit tests under coverage
        run: python -m coverage run --source=workspace tools/run_tests.py
      - name: Coverage report
        shell: pwsh
        run: |
          python -m coverage report --skip-empty --sort=cover
          "``````" >> $env:GITHUB_STEP_SUMMARY
          python -m coverage report --skip-empty --sort=cover >> $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY

  pester:
    # Report only until it has passed on 5 consecutive pull requests (#111 B6a; the
    # owner's decisions of 21 and 23 October 2026; docs/RELEASING.md). The installer's Pester
    # tests (tests/powershell) under Windows PowerShell 5.1, which runs the
    # installer. tools/run_pester.ps1 downloads Pester 5.9.1 from the PowerShell
    # Gallery and uses it only if the package's SHA-256 matches the one recorded
    # there; Pester is a development tool under the Apache License 2.0 and is not
    # in the package. The Python-driven installer tests in "Unit tests (Windows)"
    # stay the required check.
    name: PowerShell tests, Pester (report only)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Pester tests with the pinned Pester
        shell: powershell
        run: |
          & ./tools/run_pester.ps1 -ModuleRoot "$env:RUNNER_TEMP\pester"
          exit $LASTEXITCODE
