# Re-runs the "Review record" check (review-record.yml, #410) when a collaborator
# comments on a pull request, so posting the review record turns the check green
# without a push. A run for an issue_comment event reports on main's latest
# commit, not the pull request's head, so this workflow does not check anything
# itself: it re-runs the pull request's own Review record run for its head commit.
#
# GitHub runs this file from main, with a token that can write even for a pull
# request from a fork, so it is held to more than the rules in ci.yml's header:
# - it checks out nothing and runs no code from the pull request;
# - it never reads the comment's text; it uses only the pull request's number and
#   the commenter's author association, both set by GitHub, passed through
#   environment variables, never written into the script;
# - it runs only for a comment on a pull request by an account with write access
#   (owner, member or collaborator), the only comments that can count as a record;
# - its token can re-run workflow runs and read pull requests, nothing else.
# The new run uses the pull request's own workflow and code, with that run's
# original read-only token. Nothing here can be tested before it is on main
# (docs/RELEASING.md, "Review record").
name: Review record re-run

on:
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

# One re-run at a time per pull request; never cancelled, so a later comment
# waits and then re-runs the check again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  rerun:
    name: Re-run the review record check
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write          # re-run the pull request's Review record run
      pull-requests: read     # the pull request's head commit
    steps:
      # The latest Review record run for the head commit is re-run once it has
      # finished (a run still going may have read the comments before this one).
      - name: Re-run the check for the pull request's head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then echo "Not a pull request number."; exit 1; fi
          head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then echo "No head commit found."; exit 1; fi
          runs="repos/$GH_REPO/actions/workflows/review-record.yml/runs?event=pull_request&head_sha=$head&per_page=1"
          for try in $(seq 1 60); do
            run=$(gh api "$runs" --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
            # A pull request opened before this check existed has no run to re-run.
            if [ -z "$run" ] && [ "$try" -ge 6 ]; then
              echo "No Review record run for ${head:0:7}: push, or edit the description, to start one."
              exit 0
            fi
            if [ -n "$run" ] && [ "${run#* }" = "completed" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/${run%% *}/rerun" > /dev/null
              echo "Re-ran the Review record check (run ${run%% *}) for ${head:0:7}."
              exit 0
            fi
            sleep 10
          done
          echo "No finished Review record run for ${head:0:7} within 10 minutes: push, or edit the description, to start one."
          exit 1
