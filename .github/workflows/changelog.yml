# A pull request that changes what is shipped (the app, the installer or the
# runtime pins) needs a changelog fragment in changelog.d/ (see its README).
# CHANGELOG.md itself changes only when a release is prepared, so editing it
# does not count. Add the "no-changelog" label when a change is not worth a
# release note. Not a required check yet
# (#125); see quality.yml for how checks become required. Re-runs when labels
# change, which is why it is its own workflow.
name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  entry:
    name: Changelog entry
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require an entry for shipped changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          shipped=$(echo "$changed" | grep -E '^(workspace/|packaging/|asr_engines\.py$|offline_guard\.py$|requirements\.txt$)' || true)
          # A fragment added or changed in this pull request (not the folder's README).
          notes=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'changelog.d/*.md' | grep -v '^changelog\.d/README\.md$' || true)
          if [ -z "$shipped" ]; then echo "Nothing shipped changed: no entry needed."; exit 0; fi
          if [ -n "$notes" ]; then echo "Changelog fragment found:"; echo "$notes"; exit 0; fi
          if [ "$NO_CHANGELOG" = "true" ]; then echo "Labelled no-changelog."; exit 0; fi
          echo "These shipped files changed without a changelog fragment:"
          echo "$shipped"
          echo "Add a fragment in changelog.d/ (see changelog.d/README.md), or the no-changelog label."
          exit 1
