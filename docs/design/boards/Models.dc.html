<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Settings: downloads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1100px; height: {{height}}; display: flex; overflow: hidden; font-family: 'Archivo', 'Segoe UI', sans-serif; background: {{t.page}}; color: {{t.text}}">

  <nav aria-label="Main" style="width: 224px; flex: none; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; background: {{t.sideBg}}; border-right: 1px solid {{t.sideBorder}}">
    <div style="padding: 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.03em">Unminute<span style="color: #E56600">.</span></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Home.dc.html" style="font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{t.text}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span style="flex: 1">Meetings</span>
        <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E56600; color: #351503; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center">3</span>
      </a>
      <a href="Settings.dc.html" aria-current="page" style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; background: {{t.sideSel}}; color: {{t.text}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9"/><path d="M17 6h3"/><circle cx="15" cy="6" r="2"/><path d="M4 12h3"/><path d="M11 12h9"/><circle cx="9" cy="12" r="2"/><path d="M4 18h11"/><path d="M19 18h1"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Settings</span>
      </a>
      <a href="Help.dc.html" style="font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{t.text}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6"/><path d="M12 17h.01"/></svg>
        <span>Help and shortcuts</span>
      </a>
    </div>
  </nav>

  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Settings.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; text-decoration: none; color: {{t.link}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Settings
      </a>
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Downloads</h1>
      <p style="margin: 0; font-size: 15px; color: {{t.muted}}">Each file is checked against a published checksum before it is used. Downloads happen only here, when you choose.</p>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid {{t.line}}">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="7">
        <li style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-bottom: 1px solid {{t.rowLine}}">
          <div style="display: flex; align-items: center; gap: 14px">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">{{m.name}} <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">{{m.tag}}</span></span>
              <span style="font-size: 14px; color: {{t.muted}}">{{m.desc}}</span>
            </div>
            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: {{m.pillBg}}; color: {{m.pillFg}}">{{m.status}}</span>
            <button style="font: inherit; font-size: 14px; font-weight: {{m.btnWeight}}; min-height: 40px; padding: 0 14px; border-radius: 10px; white-space: nowrap; background: {{m.btnBg}}; color: {{m.btnFg}}; border: 1px solid {{m.btnBorder}}; opacity: {{m.btnOpacity}}">{{m.action}}</button>
            <a href="#" style="font-size: 14px; font-weight: 600; color: {{t.link}}; opacity: {{m.btnOpacity}}">{{m.more}}</a>
          </div>
          <sc-if value="{{m.progress}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="max-width: 420px; height: 10px; border-radius: 999px; overflow: hidden; background: {{t.track}}">
                <span style="display: block; height: 100%; border-radius: 999px; width: {{m.progress}}; background: {{t.fill}}"></span>
              </div>
              <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: {{t.muted}}"><span>{{m.message}}</span></div>
            </div>
          </sc-if>
          <sc-if value="{{m.note}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 13px; color: {{t.muted}}">{{m.note}}</span>
          </sc-if>
          <details>
            <summary style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Details</summary>
          </details>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","queued","resumed"],"default":"default"},"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"$preview":{"width":1100,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's tokens (workspace/ui/tokens.css), light and dark.
    const themes = {
      Light: {
        page: '#FFFFFF', text: '#142966', muted: '#566591', line: 'rgba(20,41,102,0.14)', rowLine: 'rgba(20,41,102,0.08)',
        sideBg: '#EEF7FD', sideSel: '#B4DDF6', sideBorder: 'rgba(20,41,102,0.10)', link: '#2B61BF',
        track: 'rgba(20,41,102,0.12)', fill: '#2B61BF', neutralPill: 'rgba(20,41,102,0.10)', queuedPill: '#B4DDF6',
        secBg: '#FFFFFF', secFg: '#142966', secBorder: 'rgba(20,41,102,0.28)', primaryBg: '#142966', primaryFg: '#FFFFFF'
      },
      Dark: {
        page: '#101F4E', text: '#FFFFFF', muted: 'rgba(255,255,255,0.74)', line: 'rgba(255,255,255,0.14)', rowLine: 'rgba(255,255,255,0.08)',
        sideBg: '#0B1638', sideSel: 'rgba(180,221,246,0.16)', sideBorder: 'rgba(255,255,255,0.08)', link: '#B4DDF6',
        track: 'rgba(255,255,255,0.14)', fill: '#B4DDF6', neutralPill: 'rgba(255,255,255,0.14)', queuedPill: 'rgba(180,221,246,0.2)',
        secBg: 'transparent', secFg: '#FFFFFF', secBorder: 'rgba(255,255,255,0.32)', primaryBg: '#B4DDF6', primaryFg: '#142966'
      }
    };
    const t = themes[this.props.theme ?? 'Light'] || themes.Light;
    const state = this.props.state ?? 'default';
    const queued = state === 'queued' || state === 'resumed';
    // After a restart, what the user queued carries on, and each row says so.
    const again = state === 'resumed' ? ' Carried on from the last time Unminute was open.' : '';
    // While a download runs, Download and Repair still work (they queue);
    // Check every file and Remove wait for the queue to finish.
    const wait = queued ? 0.45 : 1;
    const ready = { status: 'Ready', pillBg: '#62D098', pillFg: '#003B2A', action: 'Check every file', btnBg: t.secBg, btnFg: t.secFg, btnBorder: t.secBorder, btnWeight: 600, btnOpacity: wait, more: 'Remove…' };
    const missing = { status: 'Not downloaded', pillBg: t.neutralPill, pillFg: t.text, btnBg: t.primaryBg, btnFg: t.primaryFg, btnBorder: t.primaryBg, btnWeight: 700, btnOpacity: 1, more: '' };
    const cancel = { action: 'Cancel', btnBg: t.secBg, btnFg: t.secFg, btnBorder: t.secBorder, btnWeight: 600, btnOpacity: 1, more: '' };
    const running = { ...cancel, status: 'Downloading', pillBg: t.neutralPill, pillFg: t.text, progress: '41%', message: 'Downloading Whisper large-v3 turbo (1.62 GB, revision 0a363e9)...', note: again.trim() };
    const waiting = { ...cancel, status: 'Queued', pillBg: t.queuedPill, pillFg: t.text };
    const turbo = { name: 'Whisper large-v3 turbo', tag: '', desc: 'Speech to text. Alternative engine; slower on a processor. 1.62 GB.' };
    const large = { name: 'Whisper large-v3', tag: '', desc: "Speech to text. OpenAI's most accurate Whisper model. In our tests on Intel Arc graphics it was no more accurate than turbo. It is the largest model, so expect it to be the slowest on a processor. 3.09 GB." };
    const gpuSpeakers = { name: 'Graphics card acceleration', tag: 'Optional', desc: "Speeds up speaker identification on this computer's NVIDIA RTX 500. 2 GB." };
    return {
      t,
      height: queued ? '1000px' : '760px',
      models: [
        { ...ready, name: 'Parakeet v2', tag: 'Recommended · in use', desc: "Speech to text. Fast and accurate for English. Runs on this computer's processor. 0.66 GB." },
        { ...ready, name: 'Parakeet v3', tag: '', desc: 'Speech to text. Newer multilingual version. In our tests it was less accurate for English. 0.67 GB.' },
        queued ? { ...running, ...turbo } : { ...missing, action: 'Download (1.62 GB)', ...turbo },
        queued ? { ...waiting, note: 'Next in the queue.' + again, ...large } : { ...missing, action: 'Download (3.09 GB)', ...large },
        { ...ready, name: 'Speaker identification', tag: 'Optional', desc: 'Works out who spoke when. 0.03 GB.' },
        queued ? { ...waiting, note: 'Number 2 in the queue.' + again, ...gpuSpeakers } : { ...missing, action: 'Download (2 GB)', ...gpuSpeakers },
        { ...missing, action: 'Download (0.57 GB)', name: 'Graphics card for Whisper', tag: 'Optional', desc: "Runs Whisper large-v3 turbo and Whisper large-v3 on this computer's NVIDIA RTX 500, several times faster than on the processor. 0.57 GB." }
      ]
    };
  }
}
</script>
</body>
</html>
