# Lint configuration for CI (ruff). Deliberately modest: catch real mistakes
# (undefined names, unused imports, bugbear traps, outdated syntax) without
# forcing a restyle of working code.
line-length = 100
target-version = "py312"   # the only Python the installer accepts

[lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    # short `log = lambda msg: ...` helpers read fine.
    "E731",
]
